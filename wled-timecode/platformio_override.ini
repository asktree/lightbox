; WLED build override for the Timecode Buffer usermod.
; Copied into WLED/ by setup-build.sh (alongside a symlink of the usermod into
; WLED/usermods/timecode_buffer). Builds a "classic" ESP32 (WROOM) image that is
; a drop-in for the curtain boxes: it keeps AudioReactive AND adds the jitter
; buffer. Flash the resulting firmware over OTA from the WLED web UI.

[platformio]
default_envs = timecode_esp32

[env:timecode_esp32]
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
build_unflags = ${common.build_unflags}
; audioreactive kept so this image preserves the box's existing megadrome path;
; timecode_buffer adds the new UDP playout buffer on port 4049.
custom_usermods = audioreactive timecode_buffer
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"ESP32_TIMECODE\"
              -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = ${esp32_idf_V4.lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}
board_build.flash_mode = dio
