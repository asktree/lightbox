; WLED 0.15.3 build override for the Timecode Buffer usermod.
; 0.15.x uses the legacy usermod mechanism: a -D USERMOD_* flag that triggers
; the #ifdef include + UsermodManager::add() edited into wled00/usermods_list.cpp
; (there is no REGISTER_USERMOD macro or custom_usermods symlink system here).
;
; Build flags mirror env:esp32dev exactly (incl. AudioReactive so this image is
; a drop-in for the curtain boxes) and append -D USERMOD_TIMECODE_BUFFER.

[platformio]
default_envs = timecode_esp32_015

[env:timecode_esp32_015]
board = esp32dev
platform = ${esp32.platform}
platform_packages = ${esp32.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32.build_flags} -D WLED_RELEASE_NAME=\"ESP32\"
  ${esp32.AR_build_flags}
  -D USERMOD_TIMECODE_BUFFER
lib_deps = ${esp32.lib_deps}
  ${esp32.AR_lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}
