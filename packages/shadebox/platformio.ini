; XIAO ESP32-C6 as a standalone Zigbee coordinator for the blinds.
; Arduino-ESP32 3.x (needed for C6 + Zigbee) comes via the pioarduino platform.
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
extra_scripts = pre:toolchain_path.py
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
  -DZIGBEE_MODE_ZCZR
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3

; Over-the-air: `pio run -e xiao_c6_ota -t upload` once it's on Wi-Fi.
[env:xiao_c6_ota]
extends = env:xiao_c6
upload_protocol = espota
upload_port = shadebox.local
