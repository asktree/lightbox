; screenbox-art: generative art sketches for the screenbox panels.
; Reuses the board definitions and Wi-Fi secrets from ../screenbox so a
; sketch can be flashed to either panel (USB or OTA) with the same envs.
;
;   pio run -e fish28_ota -t upload    # 2.8" WT32S3-28S PRO  (screenbox.local)
;   pio run -e fish35_ota -t upload    # 3.5" WT32-SC01 Plus (screenbox-35.local)
; Each sketch lives in src/<name>/ and gets a <name>28 / <name>35 env pair.
[platformio]
default_envs = fish35

[common]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@^1.2.19
build_flags =
    -I src/common
    -I ../screenbox/src
    -I ../screenbox/include
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -O2

; ---- 2.8" WT32S3-28S PRO (8 MB flash, 2 MB QSPI PSRAM) ----------------------
[env:fish28]
extends = common
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_src_filter = +<common/> +<fish/>
build_flags = ${common.build_flags} -D SCREENBOX_HOSTNAME=\"screenbox\"

[env:fish28_ota]
extends = env:fish28
upload_protocol = espota
upload_port = screenbox.local

; ---- 3.5" WT32-SC01 Plus (16 MB flash, 8 MB PSRAM) --------------------------
[env:fish35]
extends = common
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<common/> +<fish/>
build_flags = ${common.build_flags} -D BOARD_WT32_SC01_PLUS=1 -D SCREENBOX_HOSTNAME=\"screenbox-35\"

[env:fish35_ota]
extends = env:fish35
upload_protocol = espota
upload_port = screenbox-35.local

; ---- comet: vertical light streak over water ----------------------------------
[env:comet28]
extends = env:fish28
build_src_filter = +<common/> +<comet/>

[env:comet28_ota]
extends = env:comet28
upload_protocol = espota
upload_port = screenbox.local

