; igled — from-scratch firmware for the Govee curtain matrices (32x30 WS2812
; on a plain ESP32, 4MB flash). Replaces WLED on these boxes.
;
; First flash onto a WLED box goes through WLED's own OTA page:
;   pio run -e igled && curl -F "update=@.pio/build/igled/firmware.bin" http://<box>/update
; After that: `pio run -e igled_ota -t upload --upload-port <box>.local` (espota)
; or POST the bin to igled's own /update.

[platformio]
default_envs = igled

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two OTA app slots. On a box first flashed over WLED's updater the partition
; table already in flash is WLED's — that's fine, the running table wins; this
; csv only matters for a from-USB flash.
board_build.partitions = default.csv
lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -D CORE_DEBUG_LEVEL=1

; USB-serial flash/build (bench recovery, or building the .bin for WLED OTA)
[env:igled]

; Wi-Fi flash once igled itself is running (ArduinoOTA/espota, port 3232)
[env:igled_ota]
upload_protocol = espota
upload_port = igled-17a9ec.local
