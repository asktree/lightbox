; igled — from-scratch firmware for the Govee curtain matrices (32x30 WS2812
; on a plain ESP32, 4MB flash). Replaces WLED on these boxes.
;
; Per-device envs bake in the box name (mDNS hostname): couch1, window.
; First flash onto a WLED box goes through WLED's own OTA page:
;   pio run -e couch1 && curl -F "update=@.pio/build/couch1/firmware.bin" http://couch1.local/update
; After that: `pio run -e couch1_ota -t upload` (espota), or POST the bin to
; igled's own /update.

[platformio]
default_envs = couch1, window

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two OTA app slots. On a box first flashed over WLED's updater the partition
; table already in flash is WLED's — that's fine, the running table wins; this
; csv only matters for a from-USB flash.
board_build.partitions = default.csv
lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Generic build (hostname igled-<mac>): bench boards, USB recovery.
[env:igled]

[env:couch1]
build_flags = ${env.build_flags} -D IGLED_NAME=\"couch1\"

[env:window]
build_flags = ${env.build_flags} -D IGLED_NAME=\"window\"

; Wi-Fi reflash once igled itself is running (ArduinoOTA/espota, port 3232)
[env:couch1_ota]
extends = env:couch1
upload_protocol = espota
upload_port = couch1.local

[env:window_ota]
extends = env:window
upload_protocol = espota
upload_port = window.local
