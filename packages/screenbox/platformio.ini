; WT32S3-28S PRO (Wireless-Tag internal model ZX2D80CE02S, PanelLan "SC05_X")
;   MCU     : ESP32-S3 (WT32-S3-WROVER-N8R2 -> 8 MB flash, 2 MB QSPI PSRAM)
;   Display : 2.8" 240x320 ST7789, 8-bit 8080 parallel bus
;   Touch   : FT5x06-compatible capacitive, I2C (SDA 8 / SCL 9 / INT 48)
;   USB-C   : native ESP32-S3 USB (Serial/JTAG) -> used for flashing + serial monitor
[platformio]
default_envs = wt32s3_28s_pro

; USB flashing (board plugged into this machine). `pio run -t upload`
[env:wt32s3_28s_pro]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; memory layout of the WROVER-N8R2 module
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lovyan03/LovyanGFX@^1.2.19
    bblanchon/ArduinoJson@^7.4.2
    links2004/WebSockets@^2.6.1

build_flags =
    -D BOARD_HAS_PSRAM=1
    ; Serial goes over the USB-C port (USB-Serial/JTAG peripheral, not OTG)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

; Over-the-air flashing via Wi-Fi once the panel is running (it advertises
; itself as screenbox.local). `pio run -e wt32s3_28s_pro_ota -t upload`
[env:wt32s3_28s_pro_ota]
extends = env:wt32s3_28s_pro
upload_protocol = espota
upload_port = screenbox.local
